name: Test

on:
  pull_request:
    branches:
      - main
      - dev
    # Skip doc-only PRs. This is file-level, not diff-level: a comment-only
    # change inside a .go file still triggers, since GitHub Actions has no
    # way to filter on what changed within a file.
    paths-ignore:
      - '**/*.md'

# Cancel a stale run for the same PR when new commits are pushed, so we
# don't burn CI minutes on outdated diffs.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install jemalloc (required for the Linux/cgo build)
        run: make setup-jemalloc

      - name: go vet
        run: make vet

      # -race, excludes e2e/ by package path — fails fast before the slower
      # e2e step below.
      - name: Unit tests (race-enabled)
        run: make test-unit

      # ~2 min, 200 simulated clients churning connect/disconnect against an
      # in-process server. The liveness/delivery floors in
      # e2e/churn_correctness_test.go were tuned on a dedicated multi-core
      # machine (see its comment), so this can be flakier on a shared,
      # 2-core CI runner than it is locally — a failure here is worth a
      # rerun before assuming a real regression.
      - name: E2E churn correctness test
        run: make test-e2e

      - name: Upload e2e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-churn-correctness-log
          path: test-result/e2e_churn_correctness.log
